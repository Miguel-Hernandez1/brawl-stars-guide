services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: playbook
      POSTGRES_USER: playbook
      POSTGRES_PASSWORD: playbook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playbook -d playbook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
